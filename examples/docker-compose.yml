services:
  dev-api:
    image: ${ZARAOS_DEV_IMAGE:-ghcr.io/your-org/zaraos-dev:latest}
    privileged: true
    entrypoint: ["/usr/local/bin/start.sh"]
    environment:
      DOCKER_TLS_CERTDIR: ""
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-42}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      GITHUB_ORG: KoalbyMQP
      GITHUB_REPOS: Core
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - ..:/workspace
      - docker-in-docker-data:/var/lib/docker

volumes:
  docker-in-docker-data:
